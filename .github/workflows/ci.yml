name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: wire_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d wire_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The Postgres store tests run here; without it they are skipped.
      TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/wire_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Packs the release tarball and installs it into an empty folder with npm and with bun, as a consumer would.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: npm ci
      - run: npm run build
      - name: Pack
        id: pack
        run: echo "tgz=$(npm pack --silent)" >> "$GITHUB_OUTPUT"
      - run: scripts/smoke-tarball.sh "${{ steps.pack.outputs.tgz }}" npm
      - run: scripts/smoke-tarball.sh "${{ steps.pack.outputs.tgz }}" bun

  # The branch protection requires this job by name: keep it `checks`. It passes only when every Node version and the package passed.
  checks:
    needs: [test, package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success && test "${{ needs.package.result }}" = success
